<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>GakuActors · 人物与预设</title>
<style>
:root{color-scheme:dark;--base:#101219;--nav:#151821;--panel:#1a1e29;--inset:#131620;--line:#2b3243;--text:#eff1f7;--muted:#a7b0c5;--accent:#beb8ff;--selection:#2b2a49;--green:#85d8ae}*{box-sizing:border-box}body{margin:0;background:var(--base);color:var(--text);font:14px "Segoe UI","Microsoft YaHei",sans-serif}h1,h2,h3,p{margin:0}h1{font-size:27px;margin-bottom:5px}h2{font-size:15px}h3{font-size:14px}p{line-height:1.55}small{color:var(--muted);font-size:12px}button,input,select{font:inherit;color:inherit;background:#222838;border:1px solid #394257;border-radius:7px;padding:8px 12px}button{white-space:nowrap}button.primary{background:var(--accent);border-color:var(--accent);color:#171531;font-weight:650}button:disabled{opacity:.45}input{width:100%;background:var(--inset);border-color:var(--line)}.top{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:12px;background:#171a24}.top strong{font-size:19px}.top img{width:28px;height:28px}.push{margin-left:auto}.status{display:flex;align-items:center;gap:7px;color:var(--muted)}.status i{width:7px;height:7px;border-radius:50%;background:#dc747e}.active-game .status{color:var(--green)}.active-game .status i{background:var(--green)}.shell{min-height:calc(100vh - 65px);display:grid;grid-template-columns:186px minmax(0,1fr)}nav{background:var(--nav);border-right:1px solid var(--line);padding:24px 12px 15px;display:flex;flex-direction:column;gap:5px}nav small{padding:0 10px 8px}nav span{padding:11px 10px;border-radius:7px;color:#bbc3d6}nav span.active{background:var(--selection);color:#e1ddff;box-shadow:inset 3px 0 #b3adff}nav b{display:inline-block;width:24px;color:var(--accent);font-weight:400}.lower{margin-top:auto;display:grid;gap:5px}main{padding:22px 24px}.header{display:flex;gap:12px;align-items:center;margin-bottom:18px}.workspace{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.bar{padding:11px 13px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.directory{padding:9px;display:grid;gap:5px}.person{padding:9px 10px;display:grid;gap:3px;border-radius:5px}.person.selected{background:var(--selection);box-shadow:inset 2px 0 var(--accent)}.work{display:grid;gap:12px}.inset{background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:15px;display:grid;gap:6px}.compact{padding:12px}.presets{display:grid;grid-template-columns:repeat(3,minmax(105px,1fr));gap:8px}.preset{padding:11px;border:1px solid var(--line);border-radius:7px;background:var(--inset);display:grid;gap:5px}.preset.selected{border-color:#918be6;background:var(--selection)}.live-grid{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:12px;align-items:start}.inspect{padding:13px;display:grid;gap:10px}.inspect hr{width:100%;border:0;border-top:1px solid var(--line)}.sample-icon{font-size:19px;color:var(--accent)}[hidden]{display:none!important}@media(max-width:1050px){.shell{grid-template-columns:145px minmax(0,1fr)}main{padding:16px}.workspace{grid-template-columns:178px minmax(0,1fr)}.live-grid{grid-template-columns:1fr}.presets{grid-template-columns:repeat(3,minmax(82px,1fr))}}
</style>
<header class=top><img src="../assets/scene-manager-window.png" alt=""><strong>GakuActors</strong><span class=push></span><span class=status><i></i><span id=connection>未检测到游戏启动</span></span><button>手动连接</button><button id=camera disabled>自由视角</button></header>
<div class=shell><nav><small>工作区</small><span class=active><b>▤</b>人物与预设</span><span><b>♙</b>场景人物</span><span><b>▱</b>场景与道具</span><span><b>⇥</b>舞台导入</span><div class=lower><span><b>◇</b>资源库与导出</span><span><b>♫</b>打开乐库</span></div></nav>
<main><div class=header><div><h1>人物与预设</h1><small id=subtitle>本地人物目录</small></div><span class=push></span><button>读取人物目录</button><button id=loading hidden>启用人物加载</button></div>
<div class=workspace>
<section class=box><div class=bar><h2>人物目录</h2><small class=push>5 位</small></div><div class=directory><input placeholder="搜索人物" aria-label="搜索人物"><div class="person selected"><span>有村麻央</span><small>身体 2 · 头部 2</small></div><div class=person>花海咲季</div><div class=person>藤田琴音</div><div class=person>月村手毬</div><div class=person>花海佑芽</div></div></section>
<div class=work><div class=live-grid id=live-grid>
<section class=box><div class=bar><div><h2>有村麻央</h2><small>造型预设</small></div><span class=push></span><button class=primary>＋ 新建预设</button></div>
<div class=compact><div class=inset id=empty><h3>还没有造型预设</h3><small>选择身体和头部，保存第一个造型。</small></div>
<div class=presets id=cards hidden><div class="preset selected"><span class=sample-icon>▤</span>初始演出服<small>系统预设</small></div><div class=preset><span class=sample-icon>▤</span>练习造型<small>自定义预设</small></div><div class=preset><span class=sample-icon>▤</span>舞台造型<small>自定义预设</small></div></div></div></section>
<aside class="box inspect" id=detail hidden><h2>已选造型</h2><strong>初始演出服</strong><small>身体 · 初始演出服<br>头部 · 基本造型</small><button>编辑预设</button><hr><h3>加入场景</h3><label for=reference>参考人物</label><select id=reference><option>与藤田琴音同位置</option></select><button class=primary disabled>加入人物</button></aside>
</div></div></div></main></div>
<script>
const live=location.search.includes('populated');
if(live){
 document.body.classList.add('active-game');
 document.querySelector('#connection').textContent='游戏已连接';
 document.querySelector('#subtitle').textContent='Live · liv_workspace_demo';
 document.querySelector('#camera').disabled=false;
 for(const id of ['loading','cards','detail'])document.getElementById(id).hidden=false;
 document.querySelector('#empty').hidden=true;
}else document.querySelector('#live-grid').style.gridTemplateColumns='1fr';
</script>
</html>
