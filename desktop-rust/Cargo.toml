[package]
name = "gakuactors-desktop"
version = "0.5.0"
edition = "2021"
publish = false
autobins = false

[[bin]]
name = "gakuactors-desktop"
path = "src/slint_main.rs"

[dependencies]
serde_json = "1"
base64 = "0.22"
png = "0.17"
slint = { version = "=1.19.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18", "unstable-winit-030"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
